
name: Build ClipForge APK and JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClipForge_source_MVP_rebind.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build Fabric JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract project
        run: unzip -q ClipForge_source_MVP_rebind.zip -d source

      - name: Build Fabric
        run: gradle -p source/ClipForge/fabric-mod build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Fabric-JAR
          path: source/ClipForge/fabric-mod/build/libs/*.jar
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q ClipForge_source_MVP_rebind.zip -d source

      - name: Build APK
        run: gradle -p source/ClipForge/android-app assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Android-APK
          path: source/ClipForge/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
