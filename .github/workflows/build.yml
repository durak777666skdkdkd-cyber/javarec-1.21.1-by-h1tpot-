
name: Build ClipForge APK and JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build Fabric JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q ClipForge_source_MVP_rebind.zip -d source
          find source -maxdepth 3 -type f | head -60

      - name: Build Fabric mod
        run: |
          gradle -p source/ClipForge/fabric-mod build --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Fabric-JAR
          path: source/ClipForge/fabric-mod/build/libs/*.jar
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q ClipForge_source_MVP_rebind.zip -d source
          find source -maxdepth 3 -type f | head -60

      - name: Build APK
        run: |
          gradle -p source/ClipForge/android-app assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Android-APK
          path: source/ClipForge/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
